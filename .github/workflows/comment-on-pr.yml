name: Bugbot Run (Always on PR)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number (e.g. 123)"
        required: true
        type: number

  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post "bugbot run" comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_COMMENT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const COMMENT = "bugbot run";

            let prNumber;

            if (context.eventName === "workflow_dispatch") {
              prNumber = Number(context.payload.inputs.pr_number);
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                throw new Error(`Invalid pr_number: ${context.payload.inputs.pr_number}`);
              }
            } else {
              prNumber = context.payload.pull_request?.number;
              if (!prNumber) {
                core.info("No PR number found in payload. Skipping.");
                return;
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: COMMENT,
            });

            core.info(`Posted "${COMMENT}" on PR #${prNumber}`);
