name: Repeat PR Comment (Manual + On Push)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number (e.g. 123)"
        required: true
        type: number
      comment_body:
        description: "Comment text to post (will repeat automatically on future pushes)"
        required: true
        type: string

  pull_request:
    types: [synchronize] # fires when new commits are pushed to an existing PR

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Store config (manual) and repeat comment (manual + auto)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_COMMENT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const isManual = context.eventName === "workflow_dispatch";
            const CONFIG_MARKER = "<!-- BB_REPEAT_COMMENT_CONFIG -->";

            // Helper: find existing config comment (from your user, since PAT)
            async function findConfigComment(prNumber) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              );
              return comments.find(c => (c.body || "").includes(CONFIG_MARKER));
            }

            async function upsertConfigComment(prNumber, bodyToStore) {
              const payload = Buffer.from(JSON.stringify({ body: bodyToStore }), "utf8").toString("base64");
              const configBody = `${CONFIG_MARKER}\n${payload}\n${CONFIG_MARKER}`;

              const existing = await findConfigComment(prNumber);
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo,
                  comment_id: existing.id,
                  body: configBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: prNumber,
                  body: configBody
                });
              }
            }

            async function readStoredBody(prNumber) {
              const existing = await findConfigComment(prNumber);
              if (!existing) return null;

              // Extract base64 payload between markers
              const parts = (existing.body || "").split(CONFIG_MARKER);
              if (parts.length < 3) return null;

              const b64 = (parts[1] || "").trim();
              if (!b64) return null;

              try {
                const json = JSON.parse(Buffer.from(b64, "base64").toString("utf8"));
                return (json.body || "").trim() || null;
              } catch {
                return null;
              }
            }

            async function postVisibleComment(prNumber, body) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body
              });
            }

            let prNumber;
            let commentBody;

            if (isManual) {
              prNumber = Number(context.payload.inputs.pr_number);
              commentBody = String(context.payload.inputs.comment_body || "").trim();

              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                throw new Error(`Invalid pr_number: ${context.payload.inputs.pr_number}`);
              }
              if (!commentBody) {
                throw new Error("comment_body is empty");
              }

              // 1) Store config so future pushes can repeat it
              await upsertConfigComment(prNumber, commentBody);

              // 2) Post visible comment now
              await postVisibleComment(prNumber, commentBody);

              core.info(`Manual: stored + posted comment for PR #${prNumber}`);
              return;
            }

            // Auto run: PR synchronize event
            prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.info("Auto: no PR number found in payload.");
              return;
            }

            // Read stored comment text; if none, do nothing
            commentBody = await readStoredBody(prNumber);
            if (!commentBody) {
              core.info(`Auto: no stored config comment found for PR #${prNumber}. Skipping.`);
              return;
            }

            await postVisibleComment(prNumber, commentBody);
            core.info(`Auto: re-posted stored comment for PR #${prNumber}`);
